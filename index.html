<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моя RPG</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: sans-serif; background: #1a1a2e; color: #eee; padding: 20px; }
    .screen { display: none; }
    .screen.active { display: block; }
    button { padding: 12px; margin: 5px; border: none; border-radius: 8px; background: #4a4a8a; color: white; font-size: 16px; }
    .hp-bar { background: #333; height: 20px; border-radius: 10px; overflow: hidden; margin: 5px 0; }
    .hp-fill { background: #e74c3c; height: 100%; transition: width 0.3s; }
  </style>
</head>
<body>
  <!-- Экран выбора класса -->
  <div id="screen-class" class="screen active">
    <h1>Выбери класс</h1>
    <button onclick="chooseClass('warrior')">⚔️ Воин (HP 120, Атака 15)</button>
    <button onclick="chooseClass('mage')">🔮 Маг (HP 80, Атака 25)</button>
  </div>

  <!-- Главный экран -->
  <div id="screen-main" class="screen">
    <h1 id="player-name">Герой</h1>
    <p>Уровень: <span id="level">1</span> | Опыт: <span id="exp">0</span>/<span id="exp-next">20</span></p>
    <p>Золото: <span id="gold">0</span></p>
    <div class="hp-bar"><div id="player-hp-bar" class="hp-fill" style="width:100%"></div></div>
    <p>HP: <span id="player-hp">120</span>/<span id="player-maxhp">120</span></p>
    <button onclick="startBattle()">⚔️ В бой со слизью</button>
  </div>

  <!-- Экран боя -->
  <div id="screen-battle" class="screen">
    <h1>Бой!</h1>
    <p>Монстр: Слизь</p>
    <div class="hp-bar"><div id="monster-hp-bar" class="hp-fill" style="width:100%"></div></div>
    <p>HP монстра: <span id="monster-hp">30</span>/30</p>
    <div class="hp-bar"><div id="battle-player-hp-bar" class="hp-fill" style="width:100%"></div></div>
    <p>Твоё HP: <span id="battle-player-hp">120</span>/<span id="battle-player-maxhp">120</span></p>
    <button onclick="attack()">🗡️ Атаковать</button>
    <p id="battle-log"></p>
  </div>

  <script src="game.js"></script>
</body>
</html>
